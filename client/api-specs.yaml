openapi: 3.0.0
info:
  title: Team 8 Backend API
  description: API specifications for the Team 8 Backend system
  version: 1.0.0
  contact:
    name: Team 8

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the login endpoint

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the user
          example: 1
        name:
          type: string
          description: Full name of the user
          example: "John Doe"
        email:
          type: string
          format: email
          description: Unique email address
          example: "john.doe@example.com"
        userNumber:
          type: string
          description: Customer identification number
          example: "CUST001"

    Policy:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the policy
          example: 101
        name:
          type: string
          description: Name of the policy
          example: "Term Life Insurance"
        summary:
          type: string
          description: Brief description of the policy
          example: "Basic life coverage"
        details:
          type: string
          description: Full details of the policy
          example: "Provides coverage for 20 years with fixed premiums."

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "yourpassword"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        role:
          type: string
          enum: [agent, user]
          description: User role
          example: "agent"
        customerId:
          type: string
          description: Customer ID
          example: "CUST001"

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user (Agent or Customer) and returns a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "500":
          description: Internal server error - Invalid credentials or missing users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customer:
    get:
      tags:
        - Customer Management
      summary: Get Customers (Agents Only)
      description: Retrieves a list of customers assigned to the authenticated agent
      operationId: getCustomers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "403":
          description: Forbidden - Non-agent attempting to access this endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-role-required: agent

  /getPolicies:
    get:
      tags:
        - Policy Management
      summary: Get Policies
      description: |
        Retrieves policies for a specific customer. Behavior varies by role:
        - **User Role**: Automatically returns policies for the authenticated user. `customerId` parameter is ignored.
        - **Agent Role**: Returns policies for the customer specified by `customerId`.
      operationId: getPolicies
      security:
        - BearerAuth: []
      parameters:
        - name: customerId
          in: query
          description: The ID of the customer whose policies are being requested (Required for agents, ignored for users)
          required: false
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        "403":
          description: Forbidden - Unauthorized role or agent omitted customerId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Customer Management
    description: Customer-related operations (Agent access only)
  - name: Policy Management
    description: Policy-related operations
