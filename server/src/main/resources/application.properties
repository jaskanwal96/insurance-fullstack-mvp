spring.application.name=insurance-backend

# Database Configuration - Uses Railway environment variables
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://dgbackendserver.database.windows.net:1433;database=DGportalBackend;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${DATABASE_USERNAME:dgportaladmin}
spring.datasource.password=${DATABASE_PASSWORD:DGportal@admin}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate settings for SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server port (Railway will set PORT environment variable)
server.port=${PORT:8080}