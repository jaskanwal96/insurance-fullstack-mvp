spring.application.name=team8-backend

# 1. Azure SQL Database Configuration
spring.datasource.url=jdbc:sqlserver://dgbackendserver.database.windows.net:1433;database=DGportalBackend;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=dgportaladmin
spring.datasource.password=DGportal@admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. JPA / Hibernate settings for SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Use the SQL Server dialect instead of MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect